<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Directory Browser - Login</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <h1>Remote Directory Browser</h1>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        autofocus
                        placeholder="admin"
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        placeholder="••••••••"
                    >
                </div>
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            <div class="login-help">
                <p>Demo credentials (click to fill):</p>
                <p id="credAdmin" style="cursor: pointer;"><strong>admin</strong> / admin123</p>
                <p id="credUser" style="cursor: pointer;"><strong>user</strong> / password</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
    <script>
        document.getElementById('credAdmin').addEventListener('click', () => {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
        });

        document.getElementById('credUser').addEventListener('click', () => {
            document.getElementById('username').value = 'user';
            document.getElementById('password').value = 'password';
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            // Clear previous errors
            errorDiv.style.display = 'none';
            
            if (!username || !password) {
                errorDiv.textContent = 'Username and password are required';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Disable button during submission
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    if (data.token) {
                        setAuthToken(data.token);
                        window.location.href = '/files?token=' + encodeURIComponent(data.token);
                    } else {
                        window.location.href = '/files';
                    }
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Login';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'An error occurred. Please try again.';
                errorDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
        
        // Check if already logged in
        const existingToken = getAuthToken();
        const checkHeaders = existingToken ? { 'Authorization': 'Bearer ' + existingToken } : {};
        fetch('/api/list?path=/', { credentials: 'same-origin', headers: checkHeaders })
            .then(response => {
                if (response.ok) {
                    window.location.href = existingToken ? '/files?token=' + encodeURIComponent(existingToken) : '/files';
                }
            })
            .catch(() => {
                // Not logged in, stay on login page
            });
    </script>
</body>
</html>
